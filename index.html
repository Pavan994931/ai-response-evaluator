<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Response Evaluation System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #020617;
      border-radius: 16px;
      padding: 24px;
      max-width: 900px;
      width: 95%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid #1f2937;
    }
    h1 {
      margin-top: 0;
      font-size: 1.8rem;
      color: #38bdf8;
      text-align: center;
    }
    p.subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #e5e7eb;
    }
    textarea {
      width: 100%;
      min-height: 90px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      resize: vertical;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    textarea:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px #0ea5e9;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      border-radius: 999px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      color: white;
    }
    button:hover {
      opacity: 0.9;
    }
    .results {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #020617;
      border: 1px solid #1f2937;
    }
    .results h2 {
      margin-top: 0;
      font-size: 1.1rem;
      color: #a855f7;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 4px 0;
      border-bottom: 1px dashed #1f2937;
    }
    .score-row:last-child {
      border-bottom: none;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      background: #111827;
      border: 1px solid #4b5563;
      margin-left: 6px;
      color: #e5e7eb;
    }
    .rating-label {
      font-weight: 600;
    }
    .footer {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: right;
    }
    .footer a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Response Evaluation System</h1>
    <p class="subtitle">
      Paste a user prompt and an AI answer to get quick quality scores
      (accuracy, relevance, clarity, completeness, safety).
    </p>

    <div class="grid">
      <div>
        <label for="prompt">User Prompt</label>
        <textarea id="prompt" placeholder="Enter the original question or instruction given to the AI..."></textarea>
      </div>
      <div>
        <label for="answer">AI Answer</label>
        <textarea id="answer" placeholder="Paste the AI-generated response here..."></textarea>
      </div>
    </div>

    <button onclick="evaluate()">Evaluate Response</button>

    <div id="results" class="results" style="display:none;">
      <h2>Evaluation Results</h2>
      <div id="scores"></div>
      <p style="margin-top: 10px; font-size: 0.9rem;">
        Overall Score:
        <span id="overall" class="rating-label"></span>
        <span id="ratingBadge" class="badge"></span>
      </p>
      <p style="font-size: 0.85rem; margin-top: 8px;">
        Feedback: <span id="feedback"></span>
      </p>
    </div>

    <div class="footer">
      Built by Pavan Kumar •
      <a href="https://github.com/Pavan994931/ai-response-evaluator" target="_blank">
        View source on GitHub
      </a>
    </div>
  </div>

  <script>
    function evaluate() {
      var prompt = document.getElementById("prompt").value.trim();
      var answer = document.getElementById("answer").value.trim();

      if (!prompt || !answer) {
        alert("Please fill both the prompt and the AI answer.");
        return;
      }

      function getWords(text) {
        return text
          .toLowerCase()
          .replace(/[^a-z0-9\s]/g, " ")
          .split(/\s+/)
          .filter(function (w) { return w.length > 0; });
      }

      var promptWords = getWords(prompt);
      var answerWords = getWords(answer);

      // count overlapping important words
      var overlap = 0;
      for (var i = 0; i < promptWords.length; i++) {
        var w = promptWords[i];
        if (w.length > 3 && answerWords.indexOf(w) !== -1) {
          overlap++;
        }
      }

      var length = answerWords.length;

      function clampScore(x) {
        if (x < 1) return 1;
        if (x > 5) return 5;
        return Math.round(x);
      }

      var accuracy = clampScore(3 + (Math.min(overlap, 5) / 5) * 2);
      var relevance = clampScore(3 + (Math.min(overlap, 5) / 5) * 2);
      var clarity = clampScore(length < 15 ? 3 : 4);
      var completeness = clampScore(length < 20 ? 2 : 4);
      var safety = 5;

      var scores = {
        accuracy: accuracy,
        relevance: relevance,
        clarity: clarity,
        completeness: completeness,
        safety: safety
      };

      var overall = (accuracy + relevance + clarity + completeness + safety) / 5;

      var ratingLabel;
      if (overall >= 4.5) ratingLabel = "Excellent";
      else if (overall >= 3.5) ratingLabel = "Good";
      else if (overall >= 2.5) ratingLabel = "Fair";
      else ratingLabel = "Poor";

      var feedback =
        "This is a quick rule-based evaluation. For production systems, combine this with human review or model-based evaluators.";

      // render scores
      var scoresDiv = document.getElementById("scores");
      var html = "";
      for (var key in scores) {
        if (scores.hasOwnProperty(key)) {
          var label = key.charAt(0).toUpperCase() + key.slice(1);
          html +=
            '<div class="score-row">' +
            "<span>" + label + "</span>" +
            "<span>" + scores[key] + " / 5</span>" +
            "</div>";
        }
      }
      scoresDiv.innerHTML = html;

      document.getElementById("overall").textContent = overall.toFixed(2) + " / 5";
      document.getElementById("ratingBadge").textContent = ratingLabel;
      document.getElementById("feedback").textContent = feedback;

      document.getElementById("results").style.display = "block";
    }
  </script>
</body>
</html>
